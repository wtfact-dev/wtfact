<!doctype html><html lang="pl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>WTFact v0.4</title><style>:root{font-family:system-ui,-apple-system,sans-serif;color:#292038;background:#f8f5ff}*{box-sizing:border-box}body{margin:0}.app{max-width:510px;margin:auto;min-height:100dvh;padding:20px 16px 90px}.top,.spread{display:flex;align-items:center;justify-content:space-between;gap:10px}.logo{font-size:30px;font-weight:950;letter-spacing:-2px}.logo span{color:#f0a51d}.pills{font-size:13px;font-weight:750;background:white;border-radius:18px;padding:10px}.card{background:white;border-radius:22px;padding:19px;margin:14px 0;box-shadow:0 4px 18px #3320500a}.hero{background:#e9d9ff}.yellow{background:#fff0b5}.mint{background:#ddf5e8}h2{margin:4px 0 12px;font-size:24px}h3{margin:0 0 8px}.muted{color:#776c86;font-size:13px}.grid{display:grid;grid-template-columns:1fr 1fr;gap:11px}.tile{border:0;border-radius:17px;background:#f0eafb;text-align:left;padding:16px;min-height:105px;color:#302441;font-weight:800;font-size:17px;cursor:pointer}.tile small{display:block;color:#796b8d;font-size:12px;margin-top:9px}.btn{border:0;border-radius:15px;background:#6b47cf;color:white;padding:15px 18px;font-size:15px;font-weight:800;cursor:pointer;width:100%}.btn.secondary{background:white;color:#52359c;border:2px solid #ddd0f9}.btn:disabled{opacity:.5;cursor:not-allowed}.choice{display:block;width:100%;text-align:left;background:white;color:#2e2440;border:2px solid #eee7fb;border-radius:14px;padding:14px;margin:8px 0;font-size:15px;font-weight:650}.choice.correct{background:#d7f5df;border-color:#67c587}.choice.wrong{background:#ffe1dc;border-color:#e7a69c}.nav{position:fixed;bottom:0;left:0;right:0;display:flex;justify-content:center;background:#fff;border-top:1px solid #ece6f2;padding:10px 5px max(12px,env(safe-area-inset-bottom))}.nav-inner{width:min(510px,100%);display:flex;justify-content:space-around}.nav button{border:0;background:none;font-size:12px;font-weight:750;color:#746884;padding:5px}.nav button.active{color:#6b47cf}.nav b{display:block;font-size:23px;margin-bottom:2px}.big{font-size:40px;font-weight:950}.row{display:flex;gap:10px;align-items:center}.pill{display:inline-block;background:#fff;padding:7px 11px;border-radius:100px;font-size:12px;font-weight:800}.avatar{font-size:75px;text-align:center}.item{border:2px solid #eee7fb;border-radius:15px;padding:12px;background:#fff;text-align:center}.item .emoji{font-size:35px}.item button{margin-top:9px;padding:8px;border:0;background:#6b47cf;color:#fff;border-radius:9px;font-weight:800;width:100%}.item button:disabled{background:#bdb6c7}input[type=range]{width:100%;accent-color:#6b47cf;height:28px}select{padding:12px;border-radius:12px;border:1px solid #ddd;width:100%;background:white}label{display:block;margin:14px 0}.hidden{display:none}#visual{background:#e9f4fa;border-radius:15px;width:100%;height:230px} .result{background:white;border-radius:14px;padding:15px;margin:12px 0}.tiny{font-size:11px;color:#83758c} .bar{height:9px;background:#ddd2ef;border-radius:8px;overflow:hidden}.bar>div{height:100%;background:#7856cf}</style></head><body><main class="app"><header class="top"><div class="logo">wtfact<span>.</span></div><div class="pills">🪙 <span id="coinsTop">0</span>　💎 <span id="gemsTop">0</span></div></header><section id="view"><div class="card hero"><h3>😎 Twój profil</h3><p>Witaj w WTFact!</p></div><div class="card"><h3>Wybierz rozgrywkę</h3><div class="grid"><button class="tile" onclick="window.wtfStart&&window.wtfStart('solo')">🧠 SOLO<small>5 gier dziennie</small></button><button class="tile" onclick="window.wtfStart&&window.wtfStart('multi')">⚔️ DUEL LIVE<small>3 gry dziennie</small></button><button class="tile" onclick="window.wtfStart&&window.wtfStart('friends')">👥 ZE ZNAJOMYM<small>Przeciwnik BOT (demo)</small></button><button class="tile" onclick="window.wtfStart&&window.wtfStart('random')">🌍 LOSOWY GRACZ<small>Przeciwnik BOT (demo)</small></button></div></div><div class="card yellow"><h3>🎁 Daily Drop</h3><p>Codzienna nagroda i monety!</p><button class="btn" onclick="window.wtfGo&&window.wtfGo('home')">ODBIERZ W APLIKACJI</button></div><p class="muted" id="startupHint">Jeżeli przyciski nie działają, otwórz ten plik w Safari — podgląd plików może blokować JavaScript.</p></section></main><nav class="nav"><div class="nav-inner" id="nav"><button onclick="window.wtfGo&&window.wtfGo('home')">🏠 Graj</button><button onclick="window.wtfGo&&window.wtfGo('shop')">🛍️ Sklep</button><button onclick="window.wtfGo&&window.wtfGo('avatar')">😎 Avatar</button><button onclick="window.wtfGo&&window.wtfGo('ranking')">🏆 Ranking</button><button onclick="window.wtfGo&&window.wtfGo('settings')">⚙️ Opcje</button></div></nav><script>
(()=>{'use strict';const KEY='wtfact_v04_state',today=()=>new Date().toLocaleDateString('en-CA');let state;try{state=JSON.parse(localStorage.getItem(KEY))}catch(e){}state=Object.assign({day:today(),solo:0,multi:0,coins:150,gems:20,claimed:'',items:[],avatar:'😎',premium:false,sound:true,language:'pl',wins:0,played:0},state||{});if(state.day!==today()){state.day=today();state.solo=0;state.multi=0}let tab='home',game=null,answered=false,selection=null,scale=12,price=40,round=0,points=0,bot=0,kind='solo';const save=()=>{try{localStorage.setItem(KEY,JSON.stringify(state))}catch(e){}};const $=id=>document.getElementById(id);const el=(tag,txt,cl)=>{let n=document.createElement(tag);if(txt!==undefined)n.textContent=txt;if(cl)n.className=cl;return n};function btn(label,fn,cls='btn'){let b=el('button',label,cls);b.onclick=fn;return b}function card(title,cls='card'){let c=el('div',undefined,cls);if(title)c.append(el('h3',title));return c}function line(text,cl='muted'){return el('p',text,cl)}function go(t){tab=t;game=null;render()}function header(){ $('coinsTop').textContent=state.coins;$('gemsTop').textContent=state.gems;let nav=$('nav');nav.replaceChildren();[['home','🏠','Graj'],['shop','🛍️','Sklep'],['avatar','😎','Avatar'],['ranking','🏆','Ranking'],['settings','⚙️','Opcje']].forEach(([t,i,n])=>{let b=el('button',undefined,t===tab?'active':'');b.append(el('b',i),document.createTextNode(n));b.onclick=()=>go(t);nav.append(b)})}window.wtfStart=start;window.wtfGo=go;function render(){header();let v=$('view');v.replaceChildren();if(game){renderGame(v);return}if(tab==='home')home(v);else if(tab==='shop')shop(v);else if(tab==='avatar')avatar(v);else if(tab==='ranking')ranking(v);else settings(v)}function home(v){let a=card('Twój profil','card hero');a.append(line(state.avatar+'  Początkujący odkrywca • '+state.played+' rozgrywek'));v.append(a);let c=card('Wybierz rozgrywkę');let g=el('div',undefined,'grid');[['solo','🧠 SOLO','Pozostało '+Math.max(0,5-state.solo)+'/5'],['multi','⚔️ DUEL LIVE','Pozostało '+Math.max(0,3-state.multi)+'/3'],['friends','👥 ZE ZNAJOMYM','Demo: przeciwnik BOT'],['random','🌍 LOSOWY GRACZ','Demo: przeciwnik BOT']].forEach(([k,n,s])=>{let b=el('button',undefined,'tile');b.append(document.createTextNode(n),el('small',s));b.onclick=()=>start(k);g.append(b)});c.append(g);v.append(c);let d=card('🎁 Daily Drop','card yellow');d.append(line(state.claimed===today()?'Dzisiejsza nagroda odebrana. Wróć jutro!':'Odbierz codzienną nagrodę: monety i szansę na dodatek dla avatara.'));let claim=btn(state.claimed===today()?'Odebrano ✓':'ODBIERZ NAGRODĘ',()=>{if(state.claimed===today())return;state.claimed=today();let win=Math.random()<.25?'🎩':null;state.coins+=60;if(win&&!state.items.includes(win))state.items.push(win);save();alert('🎁 +60 monet'+(win?' oraz 🎩 Kapelusz!':''));render()});claim.disabled=state.claimed===today();d.append(claim);v.append(d);let e=card('Jak działa WTFact?');e.append(line('4 konkurencje: Price Battle, Scale Battle, Who Said It? i Real or BS?'),line('Free: 5 solo + 3 multi dziennie. Premium: 8 zł/mies. Lifetime: 80 zł. Zakupy są wyłączone w demo.'));v.append(e)}const questions=[{type:'PRICE BATTLE',emoji:'🍌',q:'Za ile sprzedano banana przyklejonego do ściany?',answer:6240000,info:'Dzieło „Comedian” sprzedano w 2024 r. za 6,24 mln USD wraz z opłatami.'},{type:'SCALE BATTLE',emoji:'🗽',q:'Dopasuj długość Forda Mustanga do wysokości Statuy Wolności z cokołem.',answer:4.78/93*100,info:'Statua z cokołem ma 93 m, a przykładowy Mustang około 4,78 m długości. Prawidłowa proporcja to 5,14%.'},{type:'WHO SAID IT?',emoji:'💬',q:'Kto powiedział „Myślę, więc jestem”?',options:['Albert Einstein','René Descartes','Steve Jobs','William Shakespeare'],correct:1,info:'To słynne zdanie René Descartes’a (Kartezjusza).'},{type:'REAL OR BS?',emoji:'🍞',q:'Tost z wizerunkiem Maryi sprzedano za około 28 000 dolarów.',options:['Prawda','Ściema'],correct:0,info:'Prawda. Tost sprzedano na aukcji internetowej w 2004 roku.'}];function start(k){if(k==='solo'&&state.solo>=5&&!state.premium){alert('Wykorzystano 5 gier solo na dziś. Wróć jutro!');return}if(k!=='solo'&&state.multi>=3&&!state.premium){alert('Wykorzystano 3 gry multi na dziś. Wróć jutro!');return}kind=k;if(k==='solo')state.solo++;else state.multi++;state.played++;save();round=0;points=0;bot=0;answered=false;selection=null;scale=12;price=40;game='play';render()}function renderGame(v){if(game==='finish'){let c=card('🏆 Koniec pojedynku!','card hero');c.append(el('div',points+' : '+bot,'big'),line(kind==='solo'?'Twój wynik: '+points+' punktów':points>bot?'Wygrałeś!':points===bot?'Remis!':'Bot wygrał!'));c.append(btn('ZAGRAJ PONOWNIE',()=>start(kind)));c.append(btn('MENU GŁÓWNE',()=>go('home'),'btn secondary'));v.append(c);return}let q=questions[round],c=card('Runda '+(round+1)+'/4 • '+q.type,'card hero');c.append(line((kind==='solo'?'SOLO':'⚔️ TY '+points+' : '+bot+' BOT')+' • '+q.emoji));c.append(el('h2',q.q));if(q.options){q.options.forEach((opt,i)=>{let b=btn(String.fromCharCode(65+i)+'. '+opt,()=>{if(answered)return;answered=true;selection=i;score(i===q.correct?100:0);render()},'choice'+(answered?(i===q.correct?' correct':i===selection?' wrong':''):''));b.disabled=answered;c.append(b)})}else if(q.type==='PRICE BATTLE'){c.append(line('Zgadnij cenę suwakiem. Zakres jest logarytmiczny.'));let val=Math.round(Math.pow(10,2+price/100*6));c.append(el('div',val.toLocaleString('pl-PL')+' $','big'));let slider=el('input');slider.type='range';slider.min=0;slider.max=100;slider.value=price;slider.disabled=answered;slider.oninput=()=>{price=+slider.value;render()};c.append(slider);if(!answered)c.append(btn('ZATWIERDŹ CENĘ',()=>{answered=true;selection=val;let error=Math.abs(Math.log(val/q.answer));score(Math.max(0,Math.round(200-error*45)));render()}))}else{c.append(line('Przesuń suwak. Statua jest nieruchoma, Mustang zmienia długość.'));let visual=document.createElementNS('http://www.w3.org/2000/svg','svg');visual.setAttribute('viewBox','0 0 350 230');visual.setAttribute('id','visual');visual.innerHTML='<rect y="197" width="350" height="33" fill="#c2dfcc"/><rect x="72" y="156" width="68" height="41" fill="#b9b1a2"/><path d="M91 155 L93 105 L82 94 L91 71 L94 42 L90 24 L98 20 L105 35 L110 67 L125 94 L117 100 L112 88 L111 156Z" fill="#6ba69f" stroke="#36796f" stroke-width="2"/><path d="M95 24 L88 11 L104 17 L112 8 L109 27" fill="#e8bd6e"/><text x="106" y="217" text-anchor="middle" font-size="11">Statua</text><g id="mustang"><path d="M-52 9 L-42 -1 L-22 -3 L-8 -16 L22 -16 L38 -2 L53 2 L57 12 L-52 12Z" fill="#ee6c5c" stroke="#9a352d" stroke-width="2"/><path d="M-5 -13 L19 -13 L29 -3 L-17 -3Z" fill="#a9d4e9"/><circle cx="-34" cy="13" r="9" fill="#252936"/><circle cx="36" cy="13" r="9" fill="#252936"/></g><text x="252" y="217" text-anchor="middle" font-size="11">Mustang</text>';c.append(visual);let slider=el('input');slider.type='range';slider.min=1;slider.max=30;slider.step=.2;slider.value=scale;slider.disabled=answered;slider.oninput=()=>{scale=+slider.value;setScale(visual)};c.append(slider);if(!answered)c.append(btn('ZATWIERDŹ SKALĘ',()=>{answered=true;selection=scale;let err=Math.abs(Math.log(scale/q.answer));score(Math.max(0,Math.round(200-err*80)));render()}));setTimeout(()=>{let s=$('visual');if(s)setScale(s)},0)}if(answered){let r=card('✨ Odkrycie','result');if(q.options)r.append(line(selection===q.correct?'🎉 Trafione!':'😅 Nie tym razem.'));else if(q.type==='SCALE BATTLE')r.append(line('Twój rozmiar: '+selection.toFixed(1)+'% • prawdziwy: '+q.answer.toFixed(1)+'%'));else r.append(line('Prawdziwa cena: '+q.answer.toLocaleString('pl-PL')+' $'));r.append(line(q.info));c.append(r);c.append(btn(round===3?'ZOBACZ WYNIK 🏆':'NASTĘPNA RUNDA →',()=>{if(round===3){game='finish';state.coins+=Math.floor(points/10);if(points>bot)state.wins++;save()}else{round++;answered=false;selection=null}render()}))}v.append(c)}function setScale(svg){let g=svg.querySelector('#mustang');if(g)g.setAttribute('transform','translate(252 187) scale('+(scale/10)+')')}function score(n){points+=n;if(kind!=='solo')bot+=Math.round(Math.random()*160)}const goods=[['🎩','Kapelusz',100,'coins'],['🕶️','Okulary',150,'coins'],['👑','Korona',30,'gems'],['🦄','Jednorożec',45,'gems']];function shop(v){v.append(el('h2','Sklep WTF'));v.append(line('Przedmioty kosmetyczne. Żadnych bonusów do wyników.'));let g=el('div',undefined,'grid');goods.forEach(([emoji,name,cost,currency])=>{let c=el('div',undefined,'item');c.append(el('div',emoji,'emoji'),el('strong',name),line(cost+(currency==='coins'?' 🪙':' 💎')));let owned=state.items.includes(emoji),b=btn(owned?'POSIADASZ':'KUP',()=>{if(state[currency]<cost){alert('Za mało waluty. W demo nie można dokupić klejnotów.');return}state[currency]-=cost;state.items.push(emoji);save();render()},'');b.disabled=owned;c.append(b);g.append(c)});v.append(g);let c=card('💎 Doładowania');c.append(line('Zakupy prawdziwymi pieniędzmi będą dostępne dopiero po integracji płatności App Store. W tym demo są wyłączone.'));v.append(c)}function avatar(v){v.append(el('h2','Mój avatar'));let c=card('Twoja postać','card hero');c.append(el('div',state.avatar,'avatar'));c.append(line('Wybierz wygląd postaci:'));let g=el('div',undefined,'grid');['😎','🤖','🐸','👽',...state.items].forEach(e=>{let b=btn(e+(e===state.avatar?' ✓':''),()=>{state.avatar=e;save();render()},'tile');g.append(b)});c.append(g);v.append(c)}function ranking(v){v.append(el('h2','Leaderboard'));let c=card('Ranking — wersja demonstracyjna');c.append(line('Prawdziwy ranking wymaga kont i serwera. Poniżej Twoje lokalne statystyki.'));c.append(el('div','🏆 '+state.wins+' zwycięstw','big'));c.append(line('Rozegrane mecze: '+state.played));v.append(c)}function settings(v){v.append(el('h2','Ustawienia'));let c=card('Preferencje');let s=el('label');s.append('🔊 Dźwięk ');let check=el('input');check.type='checkbox';check.checked=state.sound;check.onchange=()=>{state.sound=check.checked;save()};s.append(check);c.append(s);let lang=el('label','🌍 Język interfejsu (w pełnej wersji)');let sel=el('select');[['pl','Polski'],['en','English — planowane']].forEach(([k,n])=>{let o=el('option',n);o.value=k;sel.append(o)});sel.value=state.language;sel.onchange=()=>{state.language=sel.value;save();alert('Pełne tłumaczenie pojawi się w kolejnej wersji.')};lang.append(sel);c.append(lang);v.append(c);let p=card('Plany płatne');p.append(line('Premium 8 zł/mies. • Lifetime 80 zł. Oba zdejmują limity.'));p.append(line('Płatności nie są aktywne w prototypie.'));v.append(p);let d=card('Dane demonstracyjne');d.append(btn('RESETUJ POSTĘP DEMO',()=>{if(confirm('Usunąć zapisany postęp demo?')){localStorage.removeItem(KEY);location.reload()}},'btn secondary'));v.append(d)}save();render()})();
</script></body></html>
